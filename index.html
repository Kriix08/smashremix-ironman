<!doctype html>
<html lang="en">
  <head>
    <title>SSB64 Ironman Randomizer</title>
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="images/favicon/48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/192.png">

    <link rel="preload" fetchpriority="high" as="script" href="ironman.js">
    <script type="text/javascript" src="ironman.js"></script>

    <link rel="preload" fetchpriority="high" href="style.css" as="style">
    <link rel="stylesheet" href="style.css">

    <link rel="preload" href="images/bg.webp" as="image" type="image/webp">
    <link rel="preload" href="font/Alata-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" as="image" type="image/svg+xml" href="images/svg/caret-left.svg" crossorigin>
    <link rel="preload" as="image" type="image/svg+xml" href="images/svg/caret-right.svg" crossorigin>

    <meta name="viewport" width="device-width" initial-scale="1">
    <meta property="og:type" content="website">
    <meta property="og:title" content="SSB64 Ironman Randomizer">
    <meta property="og:url" content="https://kriix08.github.io/smashremix-ironman/">
    <meta property="og:image" content="https://kriix08.github.io/smashremix-ironman/images/favicon/192.png" />
    <meta property="og:description" content="Ironman character order randomizer for Smash 64 & Smash Remix!">
    <meta name="msapplication-TileColor" content="#FFC700" />
    <meta name="theme-color" content="#FFC700" />
    <meta name="author" content="Krix08" />
  </head>

  <body>
  <div class="wrapper">
    <div class="container">

      <!-- Top-most section (title, player count..) -->
      <div class="top-bar">
        <h1 class="title"><i>Ironman Randomizer</i></h1>

        <!-- Players button -->
        <div class="selector">
          <div class="selector-shadow" style="float: left;">
            <div class="selector-caret-left" onclick="updatePlayerCount(-1)"></div>
          </div>

          <p class="selector-shadow selector-text" style="float: left;"><b>PLAYERS</b></p>

          <div class="selector-shadow" style="float: right;">
            <div class="selector-caret-right" onclick="updatePlayerCount(1)"></div>
          </div>

          <p class="selector-value" style="float: right;">2</p>
        </div>

      </div>

      <!-- Container for all character select elements (text, characters, presets..) -->
      <div class="select-box">
        <h2 style="margin: 5px; filter: drop-shadow(1px 1px 2px #000) drop-shadow(-1px -1px 2px #000);">
          Currently selected characters for play in randomized Ironman order:
        </h2>
        <div class="character-list"></div>

        <div class="presets">
          <input type="button" class="button" value="SAVE" onclick="savePreset()"></input>
          <input type="button" class="button" value="LOAD" onclick="applyPreset('load')"></input>
          <p><b style="filter: drop-shadow(1px 1px 2px #000) drop-shadow(-1px -1px 2px #000);">Presets: </b>
          <span style="white-space: nowrap" id="presets-list"></span>
          </p>
        </div>
      </div>

      <!-- P1 randomization -->
      <div id="random-p1">
        <input type="button" class="button" value="RANDOMIZE P1" onclick="randomizeCharacters('p1')">

        <div class="random-box">
          <div class="random-list" id="random-list-p1">
            <div class="character-container">
              <picture>
                <source srcset="images/characters/NONE.webp" type="image/webp">
                <img class="character" src="images/characters/NONE.png" draggable="false" alt="?">
              </picture>
            </div>
          </div>
        </div>

      </div>

      <!-- P2 randomization -->
      <div id="random-p2">
        <input type="button" class="button" value="RANDOMIZE P2" onclick="randomizeCharacters('p2')">

        <div class="random-box">
          <div class="random-list" id="random-list-p2">
            <div class="character-container">
              <picture>
                <source srcset="images/characters/NONE.webp" type="image/webp">
                <img class="character" src="images/characters/NONE.png" draggable="false" alt="?">
              </picture>
            </div>
          </div>
        </div>

      </div>

      <!-- P3 randomization -->
      <div id="random-p3" style="display:none">
        <input type="button" class="button" value="RANDOMIZE P3" onclick="randomizeCharacters('p3')">

        <div class="random-box">
          <div class="random-list" id="random-list-p3">
            <div class="character-container">
              <picture>
                <source srcset="images/characters/NONE.webp" type="image/webp">
                <img class="character" src="images/characters/NONE.png" draggable="false" alt="?">
              </picture>
            </div>
          </div>
        </div>

      </div>

      <!-- P4 randomization -->
      <div id="random-p4" style="display:none">
        <input type="button" class="button" value="RANDOMIZE P4" onclick="randomizeCharacters('p4')">

        <div class="random-box">
          <div class="random-list" id="random-list-p4">
            <div class="character-container">
              <picture>
                <source srcset="images/characters/NONE.webp" type="image/webp">
                <img class="character" src="images/characters/NONE.png" draggable="false" alt="?">
              </picture>
            </div>
          </div>
        </div>

      </div>

    </div>
    
    <!-- Credits :> -->
    <div class="credits">
      <p>Commissioned by 1upshyguy</p>
      <p>Created by Krix08 - 
        <a href="https://github.com/Kriix08/smashremix-ironman" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
          <img src="images/svg/gh_white.svg", height="16" width="16" style="position: relative; bottom:-2px; filter: brightness(70%);" alt=""/> 
          Repository</p>
        </a>
      <p>Character artworks for Dragon King & Peppy by TheRealFox64 - Metal Bros, Dr. Luigi, Lanky Kong & Roy by TheDelta769</p>
    </div>

  </div>
  </body>
</html>
