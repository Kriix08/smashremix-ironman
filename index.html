<!doctype html>
<html>
  <head>
    <title>SSB64 Ironman Randomizer</title>
    <link rel="preload" href="style.css" as="style" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon/16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon/32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="images/favicon/48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="images/favicon/192.png">
    <script type="text/javascript" src="ironman.js"></script>
  </head>

  <body>
  <div class="wrapper">
    <div class="container">
      <div class="select-box">
        <h2 style="margin:5px; filter: drop-shadow(1px 1px 2px #000) drop-shadow(-1px -1px 2px #000);">
          Currently selected characters for play in randomized Ironman order:
        </h2>
        <div class="character-list"></div>

        <div class="presets">
          <input type="button" class="button" value="SAVE" onclick="savePreset()"></input>
          <input type="button" class="button" value="LOAD" onclick="applyPreset('load')"></input>
          <p><b style="filter: drop-shadow(1px 1px 2px #000) drop-shadow(-1px -1px 2px #000);">Presets: </b>
          <span style="white-space: nowrap" id="presets-list"></span>
          </p>
        </div>
      </div>

      <input type="button" class="button" value="RANDOMIZE P1" onclick="randomizeCharacters('p1')">
      <div class="random-box">
        <div class="random-p1"></div>
      </div>

      <input type="button" class="button" value="RANDOMIZE P2" onclick="randomizeCharacters('p2')">
      <div class="random-box">
        <div class="random-p2"></div>
      </div>
    </div>
    
    <div class="credits">
      <p>Commissioned by 1upshyguy</p>
      <p>Created by Krix08 - 
        <a href="https://github.com/Kriix08/smashremix-ironman" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
          <img src="images/svg/gh_white.svg", height="16" width="16" style="position: relative; bottom:-2px; filter: brightness(70%);"/> 
          Repository</p>
        </a>
      <p>Character artworks for Dragon King & Peppy by TheRealFox64 - Metal Bros, Dr. Luigi, Lanky Kong & Roy by TheDelta769</p>
    </div>

  </div>
  </body>
</html>
